services:
  notifier:
    build: .
    container_name: notifier_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./state.json:/app/state.json
    environment:
      - TZ=Asia/Tokyo
      - TWITTER_PUSH_HOST=0.0.0.0
      - TWITTER_PUSH_PORT=8787
  angelic:
    profiles: [twitter-push]
    build: .
    command: ["node", "angelic-start.js"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - notifier
    volumes:
      - ./angelic-data:/data
    environment:
      - WEBHOOK_ENDPOINT=http://notifier:8787/twitter/push
